<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shrederiq · bikeparky ČR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <h1>shrederiq</h1>
    <p class="sub">Bikeparky a trail centra v ČR</p>
    <input id="search" type="search" placeholder="Hledat park, obec, kraj…" autocomplete="off">
    <div id="legend">
      <span><i class="dot bikepark"></i> Bikepark</span>
      <span><i class="dot trail_center"></i> Trail centrum</span>
    </div>
    <ul id="list"></ul>
    <div id="status">Načítám…</div>
  </aside>

  <aside id="card" hidden aria-live="polite"></aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="parks.js"></script>
  <script src="app.js"></script>
</body>
</html>
