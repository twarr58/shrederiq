<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shrederiq · bikeparky ČR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <aside id="panel">
    <h1>shrederiq</h1>
    <p class="sub">Bikeparky, trailparky a singltreky v ČR</p>
    <div class="row">
      <input id="search" type="search" placeholder="Hledat park, obec, kraj…" autocomplete="off">
      <button id="locate" type="button" title="Seřadit podle mé polohy" aria-label="Moje poloha">📍</button>
    </div>
    <div class="row chips">
      <button id="toggle-list" type="button" class="chip" aria-expanded="false" aria-controls="list">Seznam parků</button>
      <label class="chip" title="Všechny pumptracky z OpenStreetMap"><input type="checkbox" id="layer-pumptracks" checked><i class="dot pump-layer"></i> pumptracky (OSM)</label>
    </div>
    <div id="legend" hidden>
      <span><i class="dot bikepark"></i> Bikepark</span>
      <span><i class="dot trail_center"></i> Trailpark / singltrek</span>
      <span><i class="dot pumptrack"></i> Pumptrack</span>
    </div>
    <ul id="list" hidden></ul>
    <div id="status" hidden>Načítám…</div>
  </aside>

  <aside id="card" hidden aria-live="polite"></aside>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="config.js"></script>
  <script src="parks.js"></script>
  <script src="weather.js"></script>
  <script src="nav.js"></script>
  <script src="trails.js"></script>
  <script src="app.js"></script>
</body>
</html>
