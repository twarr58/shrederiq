name: pages

on:
  push:
    branches: [main]
    paths: [web/**, scripts/**, .github/workflows/pages.yml]
  # lajny z OpenStreetMap se obnovují jednou týdně
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Data parků z OSM (scripts/park_osm.py): lajny → web/data/trails.geojson,
      # základna a parkoviště → web/data/parks_osm.json. Overpass bývá přetížený, proto
      # se poslední úspěšná odpověď drží v cache; bez ní se stránka nasadí bez těchto dat.
      - uses: actions/cache/restore@v4
        with:
          path: |
            .osm-cache/parks.json
            .osm-cache/elevation.json
          key: osm-parks-${{ github.run_id }}
          restore-keys: osm-parks-
      - name: Park data from OSM
        timeout-minutes: 30
        run: |
          mkdir -p .osm-cache
          rm -f .osm-cache/fresh.json
          OUT="--trails web/data/trails.geojson --info web/data/parks_osm.json --summary .osm-cache/summary.md"
          # 1) výřez Geofabrik (spolehlivý), 2) Overpass, 3) poslední odpověď z cache
          if scripts/osm_extract.sh .osm-cache/fresh.json && python3 scripts/park_osm.py --cache .osm-cache/fresh.json $OUT; then
            mv .osm-cache/fresh.json .osm-cache/parks.json
          elif rm -f .osm-cache/fresh.json && python3 scripts/park_osm.py --cache .osm-cache/fresh.json $OUT; then
            echo "::warning::Geofabrik extract failed, used Overpass"
            mv .osm-cache/fresh.json .osm-cache/parks.json
          elif [ -f .osm-cache/parks.json ]; then
            echo "::warning::Geofabrik and Overpass failed, using the cached data"
            python3 scripts/park_osm.py --cache .osm-cache/parks.json $OUT || echo "::warning::park data not generated"
          else
            echo "::warning::no OSM data source available, deploying without trails and bases"
          fi
          [ -f .osm-cache/summary.md ] && cat .osm-cache/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      # Sklon lajn: výšky z Mapy.com Elevation API (klíč jen v Actions, do stránky se nedostane).
      # Klíč omezený na doménu z Actions nefunguje – pro elevation je lepší samostatný
      # klíč MAPY_ELEVATION_KEY jen se službou Elevation. Při chybě se nasadí bez sklonu.
      - name: Trail slopes from Mapy.com elevation
        if: hashFiles('web/data/trails.geojson') != ''
        timeout-minutes: 15
        env:
          MAPY_ELEVATION_KEY: ${{ secrets.MAPY_ELEVATION_KEY }}
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: |
          cp web/data/trails.geojson /tmp/trails.bak
          python3 scripts/elevation.py web/data/trails.geojson --cache .osm-cache/elevation.json \
            || { echo "::warning::elevation failed, deploying trails without slope"; cp /tmp/trails.bak web/data/trails.geojson; }
      - if: hashFiles('.osm-cache/parks.json') != ''
        uses: actions/cache/save@v4
        with:
          path: |
            .osm-cache/parks.json
            .osm-cache/elevation.json
          key: osm-parks-${{ github.run_id }}

      # Mapový podklad:
      #  - secret MAPY_API_KEY → Mapy.com tiles (klíč je ve stránce veřejně čitelný,
      #    v administraci Mapy.com ho omez na doménu GitHub Pages),
      #  - jinak OpenStreetMap.
      - name: Configure map tiles
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: |
          if [ -n "$MAPY_API_KEY" ]; then
            jq -n --arg k "$MAPY_API_KEY" -r \
              '"window.SHREDERIQ_CONFIG = " + ({mapyApiKey: $k, mapyMapset: "outdoor"} | tojson) + ";"' \
              > web/config.js
            echo "Using Mapy.com tiles"
          else
            echo "::warning::MAPY_API_KEY not set, falling back to OpenStreetMap tiles"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
