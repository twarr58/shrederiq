name: pages

on:
  push:
    branches: [main]
    paths: [web/**, scripts/**, .github/workflows/pages.yml]
  # lajny z OpenStreetMap se obnovují jednou týdně
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # Trailové lajny z OSM → web/data/trails.geojson. Overpass bývá přetížený, proto
      # se poslední úspěšná odpověď drží v cache; bez ní se stránka nasadí bez lajn.
      - uses: actions/cache/restore@v4
        with:
          path: .osm-cache/overpass.json
          key: overpass-${{ github.run_id }}
          restore-keys: overpass-
      - name: Trail lines from OSM
        timeout-minutes: 30
        run: |
          mkdir -p .osm-cache
          rm -f .osm-cache/fresh.json
          if python3 scripts/fetch_osm_parks.py --cache .osm-cache/fresh.json --park-trails web/data/trails.geojson; then
            mv .osm-cache/fresh.json .osm-cache/overpass.json
          elif [ -f .osm-cache/overpass.json ]; then
            echo "::warning::Overpass failed, using the cached response"
            python3 scripts/fetch_osm_parks.py --cache .osm-cache/overpass.json --park-trails web/data/trails.geojson \
              || echo "::warning::trail lines not generated"
          else
            echo "::warning::Overpass failed and there is no cache, deploying without trail lines"
          fi
      - if: hashFiles('.osm-cache/overpass.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .osm-cache/overpass.json
          key: overpass-${{ github.run_id }}

      # Mapový podklad:
      #  - secret MAPY_API_KEY → Mapy.com tiles (klíč je ve stránce veřejně čitelný,
      #    v administraci Mapy.com ho omez na doménu GitHub Pages),
      #  - jinak OpenStreetMap.
      - name: Configure map tiles
        env:
          MAPY_API_KEY: ${{ secrets.MAPY_API_KEY }}
        run: |
          if [ -n "$MAPY_API_KEY" ]; then
            jq -n --arg k "$MAPY_API_KEY" -r \
              '"window.SHREDERIQ_CONFIG = " + ({mapyApiKey: $k, mapyMapset: "outdoor"} | tojson) + ";"' \
              > web/config.js
            echo "Using Mapy.com tiles"
          else
            echo "::warning::MAPY_API_KEY not set, falling back to OpenStreetMap tiles"
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
