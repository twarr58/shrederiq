name: web

on:
  push:
    branches: [main]
    paths: [web/**, tests/**, .github/workflows/web.yml]
  pull_request:
    paths: [web/**, tests/**, .github/workflows/web.yml]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: for f in web/*.js; do node --check "$f"; done
      # parks.test.js zároveň validuje web/data/parks.geojson
      - run: node --test tests/*.test.js
