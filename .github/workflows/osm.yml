name: osm

# Porovnání web/data/parks.geojson se shluky MTB lajn v OpenStreetMap (Overpass API).
# Report se zobrazí v souhrnu běhu (Summary) a je ke stažení jako artifact.
# Skript nic necommituje – opravy parks.geojson se dělají ručně podle reportu.

on:
  pull_request:
    paths: [scripts/**, tests/test_*.py, web/data/parks.geojson, .github/workflows/osm.yml]
  push:
    branches: [main]
    paths: [scripts/**, tests/test_*.py, .github/workflows/osm.yml]
  schedule:
    - cron: "17 4 * * 1" # každé pondělí ráno
  workflow_dispatch:
    inputs:
      overpass:
        description: "Celorepublikový report přes Overpass místo výřezu Geofabrik (pomalý, odpovědi bývají neúplné)"
        type: boolean
        default: false
      dump_park:
        description: "Diagnostika: id parku, pro který vypsat cesty v okolí"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: osm-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyosmium >/dev/null
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  report:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - id: day
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # Dnešní výřez z cache; když není, obnoví se nejnovější starší a odloží se jako
      # záloha pro případ, že Geofabrik nestihne (osm_extract.sh, MTB_PBF_FALLBACK).
      - id: pbf
        uses: actions/cache/restore@v6
        with:
          path: .osm-cache/mtb.osm.pbf
          key: mtb-pbf-v4-${{ steps.day.outputs.date }}
          restore-keys: mtb-pbf-v4-
      - if: steps.pbf.outputs.cache-hit != 'true' && hashFiles('.osm-cache/mtb.osm.pbf') != ''
        run: mv .osm-cache/mtb.osm.pbf .osm-cache/mtb-stale.osm.pbf
      # lajny, základna a parkoviště kolem našich parků (to, co jde na web)
      - name: Park data from OSM
        timeout-minutes: 30
        env:
          MTB_PBF: .osm-cache/mtb.osm.pbf
          MTB_PBF_FALLBACK: .osm-cache/mtb-stale.osm.pbf
        run: |
          mkdir -p out
          scripts/osm_extract.sh out/parks-osm.json out/pumptracks.geojson
          python3 scripts/park_osm.py --cache out/parks-osm.json \
            --trails out/trails.geojson --info out/parks_osm.json --summary out/parks-summary.md \
            ${{ inputs.dump_park && format('--dump-park {0}', inputs.dump_park) || '' }}
          python3 scripts/gpx_trails.py --merge out/trails.geojson
          cat out/parks-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat out/parks-summary.md
      # čerstvě stažený výřez pod dnešní klíč (starší záloha se pod něj neukládá)
      - if: steps.pbf.outputs.cache-hit != 'true' && hashFiles('.osm-cache/mtb.osm.pbf') != ''
        uses: actions/cache/save@v6
        with:
          path: .osm-cache/mtb.osm.pbf
          key: mtb-pbf-v4-${{ steps.day.outputs.date }}
      # kontrola lajn proti veřejným GPS stopám OSM (#22); stopy v cache po týdnech
      - id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: .osm-cache/gps.json
          key: gps-traces-v2-${{ steps.week.outputs.week }}
      # porovnání s oficiálními seznamy trailů (data/official/*.json), #22
      - name: Trails vs official trail lists
        run: |
          python3 scripts/official_check.py out/trails.geojson --report out/official.md
          cat out/official.md >> "$GITHUB_STEP_SUMMARY"
      - name: Trails vs OSM GPS traces
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 scripts/gps_check.py out/trails.geojson --cache .osm-cache/gps.json --report out/gps.md
          cat out/gps.md >> "$GITHUB_STEP_SUMMARY"
      # celorepublikový report (hledání nových parků) ze stejného výřezu Geofabrik;
      # Overpass jen na vyžádání vstupem `overpass` (bývá pomalý a odpovědi neúplné)
      - name: Country report from the extract
        if: "!inputs.overpass"
        continue-on-error: true
        timeout-minutes: 15
        run: |
          PBF=.osm-cache/mtb.osm.pbf; [ -s "$PBF" ] || PBF=.osm-cache/mtb-stale.osm.pbf
          python3 scripts/osm_extract.py "$PBF" --out /dev/null --country out/country.json
          python3 scripts/fetch_osm_parks.py \
            --cache out/country.json --report out/osm-report.md \
            --geojson out/osm-clusters.geojson --trails out/osm-trails.geojson
          cat out/osm-report.md >> "$GITHUB_STEP_SUMMARY"
          cat out/osm-report.md
      - name: Fetch OSM bike parks (Overpass)
        if: inputs.overpass
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 scripts/fetch_osm_parks.py \
            --cache out/overpass.json --report out/osm-report.md \
            --geojson out/osm-clusters.geojson --trails out/osm-trails.geojson
          cat out/osm-report.md >> "$GITHUB_STEP_SUMMARY"
          cat out/osm-report.md
      - uses: actions/upload-artifact@v7
        with:
          name: osm-report
          path: out/
