name: osm

# Porovnání web/data/parks.geojson se shluky MTB lajn v OpenStreetMap (Overpass API).
# Report se zobrazí v souhrnu běhu (Summary) a je ke stažení jako artifact.
# Skript nic necommituje – opravy parks.geojson se dělají ručně podle reportu.

on:
  pull_request:
    paths: [scripts/**, tests/test_*.py, web/data/parks.geojson, .github/workflows/osm.yml]
  push:
    branches: [main]
    paths: [scripts/**, tests/test_*.py, .github/workflows/osm.yml]
  schedule:
    - cron: "17 4 * * 1" # každé pondělí ráno
  workflow_dispatch:
    inputs:
      overpass:
        description: "Spustit i celorepublikový report přes Overpass (pomalý)"
        type: boolean
        default: false
      dump_park:
        description: "Diagnostika: id parku, pro který vypsat cesty v okolí"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq python3-pyosmium >/dev/null
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v

  report:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # lajny, základna a parkoviště kolem našich parků (to, co jde na web)
      - name: Park data from OSM
        run: |
          mkdir -p out
          scripts/osm_extract.sh out/parks-osm.json out/pumptracks.geojson
          python3 scripts/park_osm.py --cache out/parks-osm.json \
            --trails out/trails.geojson --info out/parks_osm.json --summary out/parks-summary.md \
            ${{ inputs.dump_park && format('--dump-park {0}', inputs.dump_park) || '' }}
          python3 scripts/gpx_trails.py --merge out/trails.geojson
          cat out/parks-summary.md >> "$GITHUB_STEP_SUMMARY"
          cat out/parks-summary.md
      # celorepublikový report přes Overpass – jen pro hledání nových parků, smí selhat
      - name: Fetch OSM bike parks
        if: github.event_name != 'workflow_dispatch' || inputs.overpass
        continue-on-error: true
        timeout-minutes: 20
        run: |
          python3 scripts/fetch_osm_parks.py \
            --cache out/overpass.json --report out/osm-report.md \
            --geojson out/osm-clusters.geojson --trails out/osm-trails.geojson
          cat out/osm-report.md >> "$GITHUB_STEP_SUMMARY"
          cat out/osm-report.md
      - uses: actions/upload-artifact@v5
        with:
          name: osm-report
          path: out/
